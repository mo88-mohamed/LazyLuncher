name: Build and checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build LaunchForge.slnx -c Release
      - run: dotnet run --project tests/LaunchForge.Checks -c Release -- --exe
      - run: node integrations/vscode/extension.test.cjs
